name: ci
# This repository is public, so a pull request from a fork runs this
# workflow. It is fork-safe by construction: no privileged trigger, no
# secret, a read-only token, and actions pinned to a commit SHA.
# scripts/tests/test_ci_workflow.py holds every workflow here to that shape.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: skills check
        run: uv run --no-project --python 3.12 python scripts/check-skills.py
      - name: open-items check
        run: uv run --no-project --python 3.12 python scripts/check-open-items.py
      - name: harness check
        run: uv run --no-project --python 3.12 python scripts/check-harness.py
      - name: generated files are current
        run: uv run --no-project --python 3.12 python scripts/sync-harness.py --check
      - name: tests
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/tests
